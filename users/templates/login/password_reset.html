{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | CyberShield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 antialiased">

<div class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-md">
    <!-- Logo -->
    <a href="{% url 'users:home' %}" class="flex items-center justify-center space-x-2 mb-8">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-600 to-purple-600 flex items-center justify-center shadow-md shadow-indigo-200">
        <i class="fas fa-shield-halved text-white text-sm"></i>
      </div>
      <span class="text-2xl font-bold tracking-tight text-gray-900">
        Cyber<span class="text-indigo-600">Shield</span>
      </span>
    </a>

    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
      <h2 class="text-2xl font-extrabold text-gray-900 mb-2">Reset your password</h2>
      <p class="text-gray-600 mb-6">Enter your email and we'll send you an OTP to reset your password.</p>

      {% if messages %}
        {% for message in messages %}
          <div class="mb-4 p-4 rounded-xl {% if message.tags == 'success' %}bg-green-50 border-green-200 text-green-700{% elif message.tags == 'error' %}bg-red-50 border-red-200 text-red-700{% else %}bg-blue-50 border-blue-200 text-blue-700{% endif %} border flex items-start gap-3">
            <i class="fas {% if message.tags == 'success' %}fa-check-circle{% elif message.tags == 'error' %}fa-circle-exclamation{% else %}fa-info-circle{% endif %} mt-0.5"></i>
            <span>{{ message }}</span>
          </div>
        {% endfor %}
      {% endif %}

      <form method="POST" class="space-y-6">
        {% csrf_token %}
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Email Address</label>
          <div class="relative">
            <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="email" name="email" placeholder="you@example.com" required
                   class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200">
          </div>
        </div>

        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold rounded-xl shadow-md transition">
          Send OTP <i class="fas fa-arrow-right ml-2 text-sm"></i>
        </button>
      </form>
<p class="text-center text-gray-600 mt-6">
  <a href="#" onclick="history.back(); return false;" class="font-semibold text-indigo-600 hover:text-indigo-700">
    <i class="fas fa-arrow-left mr-1"></i> Go Back
  </a>
</p>
    </div>
  </div>
</div>
</body>
</html>
